/* Elrendezés: telefonra szabott egyoszlopos app. Fent az időjárás mint döntés,
   alatta a hét napjai, majd az ajánlások ikonokkal. */
:root {
  --bg: #e9efe8;
  --lap: #fbfdfa;
  --lap2: #dfe7de;
  --tinta: #15302a;
  --halk: #51665e;
  --vonal: #cbd6cb;
  --kek: #1858b8;
  --kek-halvany: #dbe7f8;
  --piros: #c8342a;
  --sarga: #e0ab00;
  --zold: #1f7d4d;
  --sav-jo: #1c6547;
  --sav-valtozo: #7c5f0a;
  --sav-rossz: #2f4d6c;
  --sav-semleges: #3f5850;
  --sav-szoveg: #f6faf6;
  --j-kint: #d9efdf;
  --j-kint-t: #17693f;
  --j-jatek: #fde3d3;
  --j-jatek-t: #b1431a;
  --j-bent: #dbe7f8;
  --j-bent-t: #1d549f;
  --j-esem: #f0e0f4;
  --j-esem-t: #7c2c8c;
  --szabadnap: #f8e3dc;
  --j-lovas: #f6e7c6;
  --j-lovas-t: #775009;
  --j-hobbi: #d0f0ee;
  --j-hobbi-t: #0b6669;
  --disp: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --szov: "Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b18;
    --lap: #172724;
    --lap2: #213530;
    --tinta: #e6efe9;
    --halk: #a2b5ac;
    --vonal: #2c423b;
    --kek: #7fb0ff;
    --kek-halvany: #1d3556;
    --piros: #ff8d7f;
    --sarga: #f2c232;
    --zold: #5fce97;
    --sav-jo: #17523a;
    --sav-valtozo: #66500c;
    --sav-rossz: #284259;
    --sav-semleges: #2a3f39;
    --j-kint: #1b4231;
    --j-kint-t: #8fe0b4;
    --j-jatek: #4d2d1b;
    --j-jatek-t: #ffb48c;
    --j-bent: #1d3556;
    --j-bent-t: #a3c6ff;
    --j-esem: #40254a;
    --j-esem-t: #e6b2f2;
    --szabadnap: #3a2422;
    --j-lovas: #46331a;
    --j-lovas-t: #f2d28f;
    --j-hobbi: #113f41;
    --j-hobbi-t: #86e2df;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b18;
  --lap: #172724;
  --lap2: #213530;
  --tinta: #e6efe9;
  --halk: #a2b5ac;
  --vonal: #2c423b;
  --kek: #7fb0ff;
  --kek-halvany: #1d3556;
  --piros: #ff8d7f;
  --sarga: #f2c232;
  --zold: #5fce97;
  --sav-jo: #17523a;
  --sav-valtozo: #66500c;
  --sav-rossz: #284259;
  --sav-semleges: #2a3f39;
  --j-kint: #1b4231;
  --j-kint-t: #8fe0b4;
  --j-jatek: #4d2d1b;
  --j-jatek-t: #ffb48c;
  --j-bent: #1d3556;
  --j-bent-t: #a3c6ff;
  --j-esem: #40254a;
  --j-esem-t: #e6b2f2;
  --szabadnap: #3a2422;
  --j-lovas: #46331a;
  --j-lovas-t: #f2d28f;
  --j-hobbi: #113f41;
  --j-hobbi-t: #86e2df;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tinta);
  font: 400 16px/1.45 var(--szov);
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--kek); }
:focus-visible { outline: 3px solid var(--kek); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-family: var(--disp); text-wrap: balance; }
svg { display: block; }

.keret {
  max-width: 560px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Időjárás-sáv */
.sav { background: var(--sav-semleges); color: var(--sav-szoveg); transition: background .25s; }
.sav[data-all="jo"] { background: var(--sav-jo); }
.sav[data-all="valtozo"] { background: var(--sav-valtozo); }
.sav[data-all="rossz"] { background: var(--sav-rossz); }
.sav .keret { padding-block: 14px 18px; display: grid; gap: 10px; }
.fejlec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.marka { font: 700 15px/1 var(--disp); letter-spacing: .01em; }
.nap-cim { font-size: 13.5px; opacity: .88; font-variant-numeric: tabular-nums; }
.itelet { font-size: 31px; line-height: 1.08; font-weight: 700; letter-spacing: -.012em; }
.indok { margin: 0; font-size: 15px; opacity: .92; }
.adatok { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
.adatok b { font-weight: 650; }
.halk-gomb {
  font-size: 13.5px;
  color: inherit;
  opacity: .85;
  text-decoration: underline;
  text-underline-offset: 2px;
  justify-self: start;
  min-height: 28px;
}

/* Hét napjai */
.napok { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding-block: 10px 2px; }
.napgomb {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 7px 0 6px;
  border-radius: 10px;
  border: 1.5px solid transparent;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--tinta);
  min-width: 0;
}
.napgomb .nn { font-weight: 650; }
.napgomb.szabad { background: var(--szabadnap); }
.napgomb.szabad .nn { color: var(--piros); }
.napgomb.unnep .nn { background: var(--piros); color: var(--lap); border-radius: 6px; padding-inline: 5px; }
.napgomb svg { width: 24px; height: 24px; }
.napgomb .fok { color: var(--halk); }
.napgomb[aria-pressed="true"] { background: var(--lap); border-color: var(--tinta); }

/* Tartalom */
main { display: grid; gap: 26px; padding-top: 16px; }
.szakasz { display: grid; gap: 10px; }
.szakasz-fej { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.szakasz h2 { font-size: 20px; font-weight: 700; line-height: 1.15; }
.masik { font-size: 14px; font-weight: 600; color: var(--kek); white-space: nowrap; min-height: 32px; }
.lista { display: grid; gap: 10px; }

.kartya { display: grid; grid-template-columns: minmax(0, 1fr) 46px; align-items: start; background: var(--lap); border: 1px solid var(--vonal); border-radius: 14px; overflow: hidden; }
.k-fo {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 12px 12px 13px;
}
.jel { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.jel svg { width: 26px; height: 26px; }
.j-kint { background: var(--j-kint); color: var(--j-kint-t); }
.j-jatek { background: var(--j-jatek); color: var(--j-jatek-t); }
.j-bent { background: var(--j-bent); color: var(--j-bent-t); }
.j-esem { background: var(--j-esem); color: var(--j-esem-t); }
.j-lovas { background: var(--j-lovas); color: var(--j-lovas-t); }
.j-hobbi { background: var(--j-hobbi); color: var(--j-hobbi-t); }
.k-kep { position: relative; display: block; width: 84px; height: 84px; }
.k-kep img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: var(--lap2); }
.k-kep .jel { position: absolute; right: -5px; bottom: -5px; width: 32px; height: 32px; border-radius: 10px; box-shadow: 0 0 0 2px var(--lap); }
.k-kep .jel svg { width: 20px; height: 20px; }
.k-kep.nincs .jel { position: static; width: 84px; height: 84px; border-radius: 12px; box-shadow: none; }
.k-kep.nincs .jel svg { width: 42px; height: 42px; }
.k-nev { display: block; font-size: 17px; font-weight: 650; line-height: 1.25; }
.k-rov { display: block; font-size: 15px; color: var(--halk); margin-top: 2px; }
.k-meta { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 13px; color: var(--halk); margin-top: 6px; }
.cimke { font-weight: 650; }
.cimke.ing { color: var(--zold); }
.cimke.zart { color: var(--piros); }
.kartya .ikon { margin-top: 8px; }
.ikon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--halk); }
.ikon svg { width: 22px; height: 22px; }
.ikon[aria-pressed="true"].sziv { color: var(--piros); }

.sor { display: flex; flex-wrap: wrap; gap: 8px; }
.gomb {
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 15px;
  font-weight: 650;
  background: var(--lap2);
  color: var(--tinta);
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

.ures { color: var(--halk); font-size: 15px; margin: 0; }
.musor { display: grid; gap: 1px; background: var(--vonal); border: 1px solid var(--vonal); border-radius: 14px; overflow: hidden; }
.musor a {
  background: var(--lap);
  padding: 11px 13px;
  text-decoration: none;
  color: var(--tinta);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-weight: 550;
  font-size: 15.5px;
}
.musor a span { color: var(--kek); }

.frissites { padding-top: 4px; font-size: 15px; }
.frissites p { margin: 0; }

/* Összes */
.kereso {
  width: 100%;
  padding: 11px 13px;
  border-radius: 11px;
  border: 1px solid var(--vonal);
  background: var(--lap);
  font-size: 16px;
}
.szurok { display: flex; gap: 7px; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.szurok::-webkit-scrollbar { display: none; }
.szuro {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px 6px 7px;
  border-radius: 99px;
  border: 1px solid var(--vonal);
  background: var(--lap);
  font-size: 14.5px;
  font-weight: 600;
}
.szuro .jel { width: 24px; height: 24px; border-radius: 7px; }
.szuro .jel svg { width: 16px; height: 16px; }
.szuro.sima { padding-left: 12px; }
.szuro[aria-pressed="true"] { background: var(--tinta); color: var(--bg); border-color: var(--tinta); }
.oldalcim { font-size: 26px; font-weight: 700; }

.mentes { display: grid; gap: 8px; font-size: 14.5px; color: var(--halk); border-top: 1px solid var(--vonal); padding-top: 14px; }
.mentes h3 { font-size: 16px; color: var(--tinta); }
.mentes p { margin: 0; }
.mentes textarea {
  width: 100%;
  min-height: 70px;
  padding: 9px;
  border-radius: 10px;
  border: 1px solid var(--vonal);
  background: var(--lap);
  font-size: 13px;
  color: var(--tinta);
}

/* Alsó sáv */
.fulek {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 5;
  background: var(--lap);
  border-top: 1px solid var(--vonal);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.fulek > div { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.ful { display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; font-size: 12.5px; font-weight: 600; color: var(--halk); }
.ful svg { width: 24px; height: 24px; }
.ful[aria-current="page"] { color: var(--kek); }

/* Részletek */
dialog.lap {
  border: 0;
  padding: 0;
  margin: auto auto 0;
  width: 100%;
  max-width: 560px;
  max-height: 88dvh;
  background: var(--bg);
  color: var(--tinta);
  border-radius: 18px 18px 0 0;
  overflow: auto;
}
dialog.lap::backdrop { background: rgba(7, 18, 15, .55); }
@media (min-width: 620px) { dialog.lap { margin: auto; border-radius: 18px; } }
.lap-bel {
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid;
  gap: 12px;
}
.lap-fej { display: grid; grid-template-columns: 42px minmax(0, 1fr) 36px; gap: 11px; align-items: start; }
.lap-fej h2 { font-size: 23px; font-weight: 700; line-height: 1.12; }
.lap-fej small { display: block; font-size: 13.5px; color: var(--halk); margin-bottom: 2px; }
.bezar { width: 36px; height: 36px; border-radius: 50%; background: var(--lap2); display: grid; place-items: center; }
.bezar svg { width: 18px; height: 18px; }
.lap-kep { margin: 0; display: grid; gap: 4px; }
.lap-kep img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; background: var(--lap2); }
.lap-kep figcaption { font-size: 12px; color: var(--halk); }
.lap-szov { margin: 0; }
.tenyek { margin: 0; display: grid; gap: 8px; }
.tenyek div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 15px; }
.tenyek dt { color: var(--halk); font-size: 14px; }
.tenyek dd { margin: 0; }
.datumok { display: flex; flex-wrap: wrap; gap: 6px; }
.datum { background: var(--lap); border: 1px solid var(--vonal); border-radius: 8px; padding: 3px 8px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tipp { background: var(--kek-halvany); border-radius: 10px; padding: 9px 11px; font-size: 14.5px; margin: 0; }
.figy { color: var(--piros); font-weight: 600; font-size: 14.5px; margin: 0; }
.lap-gombok { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lap-gombok .teljes { grid-column: 1 / -1; }
.lap-gombok .gomb[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: -2px; }
.apro { font-size: 12.5px; color: var(--halk); margin: 0; }

.uzenet {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--tinta);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 600;
  z-index: 20;
  max-width: calc(100% - 32px);
}

@media (prefers-reduced-motion: reduce) { .sav { transition: none; } }

</style>
</head>

<div class="keret"><div id="napok" class="napok" role="group" aria-label="Nap kiválasztása"></div><main id="fo"></main></div>

  <button class="ful" data-ful="osszes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Összes</button>
  <button class="ful" data-ful="sajat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.8-4.7-9.4-9.3C1.5 7.9 3.6 4.8 7 4.8c2 0 3.6 1 5 2.9 1.4-1.9 3-2.9 5-2.9 3.4 0 5.5 3.1 4.4 6.4-1.6 4.6-9.4 9.3-9.4 9.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Kedvencek</button>
</div></nav>
<dialog id="lap" class="lap" aria-label="Program részletei"></dialog>
<div id="uzenet" class="uzenet" role="status" aria-live="polite" hidden></div>

function nappaliOrak(n) {
  const ma = n.d === ymd(new Date());

  const o = n.orak.filter(x => x.h >= tol && x.h < 18);

function minosit(n) {
  if (n.orak == null || !n.orak.length) return null;

  if (x.vihar) { all = 'rossz'; ok = 'vihar'; }

/* ---------- Programok ---------- */
function esemenyIdopontok(e) {
  if (e.idopontok) return e.idopontok;
  return [];
}
function esemenyNapon(e, d) {
  if (e.tol) return d >= e.tol && d <= e.ig && !(e.zarva || []).includes(dt(d).getDay());
  return esemenyIdopontok(e).some(t => t.slice(0, 10) === d);
}
function kovetkezo(e, d) {
  if (e.tol) return e.ig >= d ? (e.tol > d ? e.tol : d) : null;
  const k = esemenyIdopontok(e).map(t => t.slice(0, 10)).filter(x => x >= d).sort();
  return k[0] || null;
}
const eid = e => 'e:' + e.id;
const esemenyElem = e => ({ ...e, id: eid(e), nev: e.cim, kat: 'esemeny', hely: e.kint ? 'kint' : 'bent', eredeti: e, ker: e.hely });

function nyitva(p, d) {
  if (p.kat === 'esemeny') return true;
  const x = dt(d), h = x.getMonth() + 1, w = x.getDay(), hn = d.slice(5);
  if (p.honapok && !p.honapok.includes(h)) return false;
  if (p.zarva && p.zarva.includes(w)) return false;
  if (p.zarvaTel && p.zarvaTel.includes(w) && (h >= 9 || h <= 4)) return false;
  if (p.zarvaNapok && p.zarvaNapok.includes(d)) return false;
  if (p.zarvaEvente && p.zarvaEvente.includes(hn)) return false;
  if (p.szezon && !p.szezon.some(([t, i]) => hn >= t && hn <= i)) return false;
  if (p.csakHetvegen && p.csakHetvegen.includes(h) && w !== 0 && w !== 6) return false;
  return true;
}

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

/* Elöl a kedvencek, a dátumhoz kötött programok és a budai helyek. */
function rangsor(lista, d) {
  return lista.map(p => {
    let s = hash(p.id + d);
    if (jelol.kedvenc[p.id]) s += 2;
    if (p.buda) s += .5;
    if (p.kat === 'esemeny') s += .5;
    s += p.elore || 0;
    return [s, p];
  }).sort((a, b) => b[0] - a[0]).map(x => x[1]);
}

/* Az ajánlatban a Pest megyei helyeknek és a kiállításoknak külön szakaszuk van. */
const helyek = (kats, helyLista, d) => PROGRAMOK.filter(p => kats.includes(p.kat) && helyLista.includes(p.hely) && !p.csakLista && !p.megye && !p.kiall && nyitva(p, d));

function aznapiak(d, csakFedett) {
  return A.esemenyek.filter(e => esemenyNapon(e, d) && !(csakFedett && e.kint)).map(esemenyElem);
}

/* Minden aznapi esemény pontosan egy szakaszba kerül. */
function esemenyekSzetosztva(d, fedett) {
  const o = { lovas: [], megye: [], kiall: [], hobbi: [], esem: [] };
  for (const e of aznapiak(d, fedett)) {
    if (e.tipus === 'lovas') o.lovas.push(e);
    else if (e.megye && szabadNap(d)) o.megye.push(e);
    else if (e.tipus === 'kiallitas') o.kiall.push(e);
    else if (e.tipus === 'sport' || e.tipus === 'hobbi') o.hobbi.push(e);
    else o.esem.push(e);
  }
  return o;
}

function szakaszok(all, d) {
  const rossz = all === 'rossz';
  const ev = esemenyekSzetosztva(d, rossz);
  const szabad = rossz ? ['bent'] : ['bent', 'kint', 'vegyes'];
  const lovas = { k: 'lovas', cim: 'Lovas program', lista: ev.lovas };
  const bol = { k: 'esem', cim: 'Aznap műsoron', lista: ev.esem, esem: true };
  const kiall = { k: 'kiall', cim: 'Kiállítás', darab: 2, lista: [...ev.kiall, ...PROGRAMOK.filter(p => p.kiall && !p.csakLista && !p.megye && szabad.includes(p.hely) && nyitva(p, d))] };
  const hobbi = { k: 'hobbi', cim: 'Próbáljatok ki valami újat', darab: 2, lista: [...ev.hobbi, ...helyek(['hobbi'], szabad, d)] };
  const megye = { k: 'megye', cim: 'Kiruccanás Pest megyébe', darab: 2, lista: szabadNap(d) ? [...ev.megye, ...PROGRAMOK.filter(p => p.megye && !p.csakLista && szabad.includes(p.hely) && nyitva(p, d))] : [] };
  const kintiek = () => helyek(['tura', 'park', 'jatszoter'], ['kint', 'vegyes'], d);
  const fedett = () => helyek(['jatek', 'muzeum'], ['bent'], d);
  if (all === 'jo') return [lovas,
    { k: 'tura', cim: 'Könnyű kirándulás', lista: helyek(['tura'], ['kint'], d) },
    { k: 'kint', cim: 'Park, játszótér', lista: helyek(['park', 'jatszoter'], ['kint', 'vegyes'], d) },
    bol, kiall, hobbi, megye];
  if (all === 'valtozo') return [lovas,
    { k: 'kint', cim: 'Kint, ha kitart az idő', lista: kintiek() },
    { k: 'bent', cim: 'B-terv fedett helyen', lista: fedett() },
    bol, kiall, hobbi, megye];
  if (rossz) return [lovas,
    { k: 'jatek', cim: 'Trambulin, játszóház', lista: helyek(['jatek'], ['bent'], d) },
    kiall, bol, hobbi,
    { k: 'muzeum', cim: 'Múzeum, kiállítás, barlang', lista: helyek(['muzeum'], ['bent'], d) },
    megye];
  return [lovas,
    { k: 'kint', cim: 'Ha jó idő lesz', lista: kintiek() },
    { k: 'bent', cim: 'Ha rossz idő lesz', lista: fedett() },
    bol, kiall, hobbi, megye];
}

/* A következő lovas események akkor is látszanak, ha a kiválasztott napon nincs ilyen. */
function kovetkezoLovasok(mar) {
  const ma = ymd(new Date());
  return A.esemenyek.filter(e => e.tipus === 'lovas' && kovetkezo(e, ma) && !mar.has(eid(e)))
    .sort((x, y) => kovetkezo(x, ma).localeCompare(kovetkezo(y, ma))).slice(0, 3).map(esemenyElem);
}

/* ---------- Rajzolás ---------- */
function savRajz() {
  const a = aktualisAllapot(), n = a.n;
  const el = $('#sav');
  el.dataset.all = a.all || '';
  const napJel = MUNKANAP.includes(A.nap) ? 'Munkanap' : unnepNev(A.nap);
  const fejNap = nagy(napNeve(A.nap)) + ', ' + hosszuDatum(A.nap) + (napJel ? ' · ' + napJel : '');
  let cim, indok = '', adat = '';
  if (A.idoTolt && !a.all) cim = 'Megnézem az időjárást…';
  else if (a.all) cim = ITELET[a.ok];
  else cim = A.idoHiba ? 'Az időjárást most nem tudom megnézni.' : 'Erre a napra még nincs előrejelzés.';

  if (a.all) {
    indok = a.mm > 0 || a.val >= 20
      ? `9 és 18 óra között ${szam(a.mm, 1)} mm eső, legfeljebb ${a.val}% eséllyel.`
      : '9 és 18 óra között száraz idő várható.';
    if (a.all === 'jo') indok += napszakonKivul(n);
    if (a.ok !== 'eso' && a.ok !== 'vihar' && (n.elozo || 0) >= 5) indok += ' Előző nap sok eső esett, sáros lehet az erdő.';
  }
  if (n.max != null) {
    adat = `<div class="adatok"><span><b>${Math.round(n.max)}°</b> / ${Math.round(n.min)}°</span><span>széllökés ${Math.round(n.szel)} km/h</span>${n.lemegy ? `<span>napnyugta ${n.lemegy}</span>` : ''}</div>`;
  }
  const elonezet = window.claude && A.idoHiba ? '<p class="indok">Az előnézetben nincs élő időjárás, a GitHub Pages-en futó appban van.</p>' : '';
  const ujra = A.idoHiba && !window.claude ? '<button class="halk-gomb" data-ujra="1">Próbáld újra</button>' : '';
  el.innerHTML = `<div class="keret">
    <div class="fejlec"><span class="marka">Kiruccanó</span><span class="nap-cim">${esc(fejNap)}</span></div>
    <h1 class="itelet">${esc(cim)}</h1>
    ${indok ? `<p class="indok">${esc(indok)}</p>` : ''}${elonezet}${adat}${ujra}
  </div>`;
}

function napokRajz() {
  const ma = ymd(new Date());
  $('#napok').innerHTML = A.napok.map(n => {
    const d = dt(n.d), w = d.getDay();
    const nv = n.d === ma ? 'Ma' : NAPROV[w];
    const unnep = !MUNKANAP.includes(n.d) && unnepNev(n.d);
    const kod = n.kod != null ? napKod(n) : null;
    return `<button class="napgomb${szabadNap(n.d) ? ' szabad' : ''}${unnep ? ' unnep' : ''}" data-nap="${n.d}" aria-pressed="${n.d === A.nap}" aria-label="${esc(nagy(napNeve(n.d)))}, ${esc(hosszuDatum(n.d))}${unnep ? ', ' + esc(unnep) : ''}">
      <span class="nn">${nv}</span>${kod != null ? idoIkon(kod) : '<svg viewBox="0 0 24 24"></svg>'}<span class="fok">${n.max != null ? Math.round(n.max) + '°' : d.getDate()}</span>
    </button>`;
  }).join('');
  $('#napok').hidden = A.ful !== 'ajanlat';
}

function metaSor(p, d) {
  const t = [];
  if (p.kat === 'esemeny') {
    t.push(`<span class="cimke">${esc(p.ag || TIPUS[p.tipus] || 'Program')}</span>`);
    const ora = d && (p.idopontok || []).filter(x => x.startsWith(d) && x.length > 10).map(x => x.slice(11));
    if (ora && ora.length) t.push(`<span>${esc(ora.join(', '))}</span>`);
    else if (!d) {
      const ma = ymd(new Date()), k = kovetkezo(p, ma);
      if (p.tol && p.ig) t.push(`<span>${esc(p.tol > ma ? `${rovNap(p.tol)} – ${rovNap(p.ig)}` : igDatum(p.ig))}</span>`);
      else if (k) t.push(`<span>${esc(rovNap(k))}</span>`);
    }
    if (p.kor) t.push(`<span>${esc(p.kor)}</span>`);
  } else {
    if (p.ag) t.push(`<span class="cimke">${esc(p.ag)}</span>`);
    if (p.ker) t.push(`<span>${esc(p.ker)}</span>`);
    const tav = p.hossz && p.hossz.split(', ')[0];
    if (tav && tav.length <= 20) t.push(`<span>${esc(tav)}</span>`);
  }
  if (p.ing) t.push('<span class="cimke ing">Ingyenes</span>');
  if (d && !nyitva(p, d)) t.push('<span class="cimke zart">Ezen a napon zárva</span>');
  return t.join('');
}

function szivGomb(p) {
  const kedv = !!jelol.kedvenc[p.id];
  return `<button class="ikon sziv" data-kedv="${esc(p.id)}" aria-pressed="${kedv}" aria-label="Kedvenc: ${esc(p.nev)}">${kedv ? IKON.szivTele : IKON.sziv}</button>`;
}

function kartya(p, d) {
  return `<article class="kartya">
    <button class="k-fo" data-nyit="${esc(p.id)}">
      ${kepDoboz(p)}
      <span><span class="k-nev">${esc(p.nev)}</span><span class="k-rov">${esc(p.rovid)}</span><span class="k-meta">${metaSor(p, d)}</span></span>
    </button>
    ${szivGomb(p)}
  </article>`;
}

const DARAB = 3;
function szakaszRajz(s, d) {
  const sor = rangsor(s.lista, d);
  if (s.esem && !sor.length) {
    return `<section class="szakasz"><h2>${esc(s.cim)}</h2>
      <p class="ures">Erre a napra nincs dátumos program a listában. Nézd meg a friss műsorokat lent.</p></section>`;
  }
  if (!sor.length) return '';
  const k = s.k + '|' + d;
  const db = s.darab || DARAB;
  const el = sor.length > db ? (A.eltol[k] || 0) % sor.length : 0;
  const mutat = [];
  for (let i = 0; i < Math.min(db, sor.length); i++) mutat.push(sor[(el + i) % sor.length]);
  return `<section class="szakasz">
    <div class="szakasz-fej"><h2>${esc(s.cim)}</h2>
      ${sor.length > db ? `<button class="masik" data-masik="${esc(k)}" data-lep="${db}">Másikat kérek</button>` : ''}
    </div>
    <div class="lista">${mutat.map(p => kartya(p, d)).join('')}</div>
  </section>`;
}

function keresId(id) {
  if (id.startsWith('e:')) {
    const e = A.esemenyek.find(x => eid(x) === id);
    if (e) return esemenyElem(e);
  }
  return PROGRAMOK.find(p => p.id === id) || jelol.kedvenc[id] || null;
}

function musorRajz() {
  const mikor = A.frissitve ? `Az aktuális programok listája frissítve: ${esc(hosszuDatum(A.frissitve))}` : 'Az aktuális programok listája kedden és csütörtökön reggel frissül.';
  return `<section class="szakasz"><h2>Friss műsorok</h2>
    <div class="musor">${MUSOROK.map(m => `<a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.nev)}<span aria-hidden="true">↗</span></a>`).join('')}</div>
    <div class="frissites">
      <p>${mikor}</p>
    </div>
  </section>`;
}

function lovasRajz(mar) {
  const lista = kovetkezoLovasok(mar);
  if (!lista.length) return '';
  return `<section class="szakasz">
    <div class="szakasz-fej"><h2>Legközelebbi lovas események</h2><button class="masik" data-ugrik="lovas">Mind</button></div>
    <div class="lista">${lista.map(p => kartya(p, null)).join('')}</div>
  </section>`;
}

function ajanlatRajz() {
  const a = aktualisAllapot();
  const sz = szakaszok(a.all, A.nap);
  const mar = new Set(sz[0].lista.map(p => p.id));
  $('#fo').innerHTML = sz.map(s => szakaszRajz(s, A.nap)).join('') + lovasRajz(mar) + musorRajz();
}

const SZUROK = [['mind', 'Mind'], ['esemeny', 'Aktuális'], ['kiallitas', 'Kiállítás'], ['lovas', 'Lovas'], ['hobbi', 'Hobbi, sport'], ['megye', 'Pest megye'], ['tura', 'Túra'], ['park', 'Park'], ['jatszoter', 'Játszótér'], ['jatek', 'Trambulin, játszóház'], ['muzeum', 'Múzeum']];
const SZURO_ESEMENY = {
  mind: () => true, esemeny: () => true,
  kiallitas: e => e.tipus === 'kiallitas', lovas: e => e.tipus === 'lovas',
  hobbi: e => e.tipus === 'hobbi' || e.tipus === 'sport', megye: e => e.megye
};
const SZURO_HELY = {
  mind: () => true, esemeny: () => false,
  kiallitas: p => p.kiall, megye: p => p.megye
};

/* A dátumos programok dátum szerint jönnek, a helyek ábécérendben. */
function szurtLista(k) {
  const ma = ymd(new Date());
  const fe = SZURO_ESEMENY[k], fh = SZURO_HELY[k] || (p => p.kat === k);
  const ev = fe ? A.esemenyek.filter(e => kovetkezo(e, ma) && fe(e)).sort((x, y) => kovetkezo(x, ma).localeCompare(kovetkezo(y, ma))).map(esemenyElem) : [];
  const pr = PROGRAMOK.filter(fh).slice().sort((x, y) => x.nev.localeCompare(y.nev, 'hu'));
  return k === 'mind' ? pr.concat(ev) : ev.concat(pr);
}

function osszesRajz() {
  const q = A.keres.trim().toLowerCase();
  let lista = szurtLista(A.szuro);
  if (q) lista = lista.filter(p => (p.nev + ' ' + p.rovid + ' ' + (p.ker || '') + ' ' + (p.ag || '')).toLowerCase().includes(q));
  $('#fo').innerHTML = `
    <section class="szakasz">
      <input id="kereso" class="kereso" type="search" placeholder="Keresés" aria-label="Keresés a programok között" value="${esc(A.keres)}">
      <div class="szurok">${SZUROK.map(([k, t]) => `<button class="szuro${KAT[k] ? '' : ' sima'}" data-szuro="${k}" aria-pressed="${A.szuro === k}">${KAT[k] ? jelSvg({ kat: k }) : ''}${esc(t)}</button>`).join('')}</div>
      <p class="apro">${lista.length} program${A.szuro === 'esemeny' ? ', dátum szerint' : SZURO_ESEMENY[A.szuro] && A.szuro !== 'mind' ? ', elöl a dátumosak' : ''}</p>
      <div class="lista">${lista.map(p => kartya(p, null)).join('') || '<p class="ures">Nincs találat.</p>'}</div>
    </section>${musorRajz()}`;
  /* Újrarajzolás után is látsszon a kiválasztott szűrő. */
  const sor = $('.szurok'), akt = sor.querySelector('[aria-pressed="true"]');
  if (akt) {
    const s = sor.getBoundingClientRect(), a = akt.getBoundingClientRect();
    sor.scrollLeft += a.left - s.left - (s.width - a.width) / 2;
  }
}

function sajatRajz() {
  const lista = Object.keys(jelol.kedvenc).map(keresId).filter(Boolean);
  const ures = 'Még nincs kedvenc. A szív ikonnal jelölhetsz egy programot, és ezek kerülnek az ajánlatok elejére.';
  $('#fo').innerHTML = `
    <section class="szakasz">
      <h2 class="oldalcim">Kedvencek</h2>
      <div class="lista">${lista.map(p => kartya(p, null)).join('') || `<p class="ures">${ures}</p>`}</div>
    </section>
    <section class="mentes">
      <h3>Mentőkód</h3>
      <p>A jelölések ezen a telefonon vannak. Másik készülékre a mentőkóddal viheted át.</p>
      <textarea id="mentokod" aria-label="Mentőkód" placeholder="Illeszd ide a mentőkódot"></textarea>
      <div class="sor"><button class="gomb" data-kod="masol">Kód másolása</button><button class="gomb" data-kod="tolt">Kód betöltése</button></div>
    </section>`;
}

function fulekRajz() {
  document.querySelectorAll('.ful').forEach(f => {
    if (f.dataset.ful === A.ful) f.setAttribute('aria-current', 'page'); else f.removeAttribute('aria-current');
  });
}

function rajzol() {
  savRajz();
  $('#sav').hidden = A.ful !== 'ajanlat';
  napokRajz();
  ({ ajanlat: ajanlatRajz, osszes: osszesRajz, sajat: sajatRajz }[A.ful])();
  fulekRajz();
  if (A.nyitott) lapRajz(A.nyitott);
}

/* ---------- Részletek lap ---------- */
function tenyek(p) {
  const s = [];
  const add = (c, v) => { if (v) s.push(`<div><dt>${esc(c)}</dt><dd>${esc(v)}</dd></div>`); };
  add(p.kat === 'esemeny' ? 'Helyszín' : p.megye ? 'Település' : 'Hely', p.ker);
  add('Cím', p.kat === 'esemeny' ? p.terkep : p.cim);
  add('Táv', p.hossz);
  add('Nyitva', p.ido);
  add('Ár', p.ar);
  add('Ajánlott', p.kor);
  add('Odajutás', p.jut);
  return s.join('');
}

function esemenyDatumok(p) {
  const ma = ymd(new Date());
  if (p.tol) return `<p class="lap-szov"><b>${esc(hosszuNap(p.tol))} – ${esc(hosszuNap(p.ig))}</b>${p.megj ? '<br>' + esc(p.megj) : ''}</p>`;
  const jovo = (p.idopontok || []).filter(t => t.slice(0, 10) >= ma);
  if (!jovo.length) return '<p class="ures">Az ismert időpontok elmúltak.</p>';
  return `<div class="datumok">${jovo.slice(0, 10).map(t => `<span class="datum">${esc(rovDatum(t.slice(0, 10)))} ${esc(hetNapja(t.slice(0, 10)))}${t.length > 10 ? ', ' + esc(t.slice(11)) : ''}</span>`).join('')}</div>`;
}

function lapRajz(id) {
  const p = keresId(id);
  if (!p) return;
  const kedv = !!jelol.kedvenc[id];
  const kep = kepAdat(p);
  const q = encodeURIComponent(p.cim && p.kat !== 'esemeny' ? p.cim : (p.terkep || p.nev));
  const zart = A.ful === 'ajanlat' && !nyitva(p, A.nap);
  const fajta = p.kat === 'esemeny' ? (TIPUS[p.tipus] || 'Program') : KAT[p.kat].nev;
  $('#lap').innerHTML = `<div class="lap-bel">
    <div class="lap-fej">${jelSvg(p)}<div><small>${esc(fajta)}${p.ag ? ', ' + esc(p.ag.toLowerCase()) : ''}</small><h2>${esc(p.nev)}</h2></div>
      <button class="bezar" data-bezar="1" aria-label="Bezárás">${IKON.x}</button></div>
    ${kep ? `<figure class="lap-kep"><img src="${esc(kep.nagy)}"${tartalekAttr(kep, 'nagy')} alt="" referrerpolicy="no-referrer"><figcaption>${kep.felirat}</figcaption></figure>` : ''}
    ${zart ? '<p class="figy">Ezen a napon zárva.</p>' : ''}
    <p class="lap-szov">${esc(p.leiras || p.rovid)}</p>
    ${p.kat === 'esemeny' ? esemenyDatumok(p) : ''}
    <dl class="tenyek">${tenyek(p)}</dl>
    ${p.tip ? `<p class="tipp">${esc(p.tip)}</p>` : ''}
    <div class="lap-gombok">
      <button class="gomb teljes" data-kedv="${esc(id)}" aria-pressed="${kedv}">${kedv ? 'Kedvenc' : 'Kedvencekhez'}</button>
      ${p.nincsTerkep ? '' : `<a class="gomb" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Térkép</a>`}
      ${p.link ? `<a class="gomb" href="${esc(p.link)}" target="_blank" rel="noopener">${p.kat === 'esemeny' ? 'Jegy, részletek' : 'Honlap'}</a>` : ''}
    </div>
    <p class="apro">Az árak és a nyitvatartás változhatnak, indulás előtt nézd meg a honlapot.</p>
  </div>`;
}

function lapNyit(id) {
  A.nyitott = id;
  lapRajz(id);
  const d = $('#lap');
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}
function lapZar() { A.nyitott = null; const d = $('#lap'); if (d.open) d.close(); }

/* ---------- Műveletek ---------- */
let uzenetIdo;
function uzen(t) {
  const u = $('#uzenet');
  u.textContent = t; u.hidden = false;
  clearTimeout(uzenetIdo);
  uzenetIdo = setTimeout(() => { u.hidden = true; }, 2200);
}
const pillanat = p => ({ id: p.id, nev: p.nev, kat: p.kat, tipus: p.tipus, ag: p.ag, ikon: p.ikon, kep: p.kep, kepForras: p.kepForras, rovid: p.rovid, ker: p.ker, leiras: p.leiras, link: p.link, hely: p.hely });

function kedvencValt(id) {
  if (jelol.kedvenc[id]) { delete jelol.kedvenc[id]; uzen('Kikerült a kedvencek közül'); }
  else { jelol.kedvenc[id] = pillanat(keresId(id)); uzen('Kedvenc lett'); }
  ment();
}
const kodol = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dekodol = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));

async function kodMuvelet(m) {
  const t = $('#mentokod');
  if (m === 'masol') {
    t.value = kodol(jelol);
    try { await navigator.clipboard.writeText(t.value); uzen('Vágólapra másolva'); }
    catch { t.select(); uzen('Jelöld ki és másold ki a kódot'); }
    return;
  }
  try {
    const u = dekodol(t.value);
    Object.assign(jelol.kedvenc, u.kedvenc || {});
    ment(); rajzol(); uzen('Mentőkód betöltve');
  } catch { uzen('Ez a kód nem jó, másold ki újra'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-nyit]');
  if (!b) { if (e.target.id === 'lap') lapZar(); return; }
  const d = b.dataset;
  if (d.ful) { A.ful = d.ful; rajzol(); window.scrollTo(0, 0); }
  else if (d.nap) { A.nap = d.nap; rajzol(); }
  else if (d.ujra) { A.idoTolt = true; rajzol(); idoLekeres(); }
  else if (d.masik) { A.eltol[d.masik] = (A.eltol[d.masik] || 0) + (+d.lep || DARAB); rajzol(); }
  else if (d.ugrik) { A.ful = 'osszes'; A.szuro = d.ugrik; A.keres = ''; rajzol(); window.scrollTo(0, 0); }
  else if (d.nyit) lapNyit(d.nyit);
  else if (d.bezar) lapZar();
  else if (d.kedv) { kedvencValt(d.kedv); rajzol(); }
  else if (d.szuro) { A.szuro = d.szuro; rajzol(); }
  else if (d.kod) kodMuvelet(d.kod);
});
document.addEventListener('input', e => {
  if (e.target.id === 'kereso') {
    A.keres = e.target.value;
    const pos = e.target.selectionStart;
    osszesRajz();
    const k = $('#kereso'); k.focus(); k.setSelectionRange(pos, pos);
  }
});
$('#lap').addEventListener('close', () => { A.nyitott = null; });
document.addEventListener('error', e => {
  const i = e.target;
  if (i.tagName !== 'IMG') return;
  if (i.dataset.tartalek) {
    const cap = i.closest('.lap-kep')?.querySelector('figcaption');
    if (cap) cap.innerHTML = i.dataset.felirat;
    i.src = i.dataset.tartalek;
    delete i.dataset.tartalek;
    return;
  }
  i.closest('.k-kep')?.classList.add('nincs');
  (i.closest('.lap-kep') || i).remove();
}, true);

/* ---------- Indulás ---------- */
async function esemenyTolt() {
  try {
    const v = await fetch('programok.json', { cache: 'no-cache' });
    if (!v.ok) throw new Error('hiba');
    const j = await v.json();
    A.esemenyek = j.esemenyek || [];
    A.frissitve = j.frissitve || null;
    rajzol();
  } catch { /* a helyszínek enélkül is működnek */ }
}

rajzol();
esemenyTolt();
idoLekeres();

</script>
</body>
</html>
