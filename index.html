<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiruccanó</title>
<meta name="description" content="Budapesti gyerekprogramok az időjáráshoz igazítva">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kiruccanó">
<meta name="theme-color" content="#e9efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1b18" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="ikon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;550;600;650&display=swap">
<style>
/* Elrendezés: telefonra szabott egyoszlopos app. Fent az időjárás mint döntés,
   alatta a hét napjai, majd az ajánlások turistajelzésekkel. */
:root {
  --bg: #e9efe8;
  --lap: #fbfdfa;
  --lap2: #dfe7de;
  --tinta: #15302a;
  --halk: #51665e;
  --vonal: #cbd6cb;
  --kek: #1858b8;
  --kek-halvany: #dbe7f8;
  --piros: #c8342a;
  --sarga: #e0ab00;
  --zold: #1f7d4d;
  --sav-jo: #1c6547;
  --sav-valtozo: #7c5f0a;
  --sav-rossz: #2f4d6c;
  --sav-semleges: #3f5850;
  --sav-szoveg: #f6faf6;
  --jelfeher: #f8f9f5;
  --disp: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --szov: "Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b18;
    --lap: #172724;
    --lap2: #213530;
    --tinta: #e6efe9;
    --halk: #a2b5ac;
    --vonal: #2c423b;
    --kek: #7fb0ff;
    --kek-halvany: #1d3556;
    --piros: #ff8d7f;
    --sarga: #f2c232;
    --zold: #5fce97;
    --sav-jo: #17523a;
    --sav-valtozo: #66500c;
    --sav-rossz: #284259;
    --sav-semleges: #2a3f39;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b18;
  --lap: #172724;
  --lap2: #213530;
  --tinta: #e6efe9;
  --halk: #a2b5ac;
  --vonal: #2c423b;
  --kek: #7fb0ff;
  --kek-halvany: #1d3556;
  --piros: #ff8d7f;
  --sarga: #f2c232;
  --zold: #5fce97;
  --sav-jo: #17523a;
  --sav-valtozo: #66500c;
  --sav-rossz: #284259;
  --sav-semleges: #2a3f39;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tinta);
  font: 400 16px/1.45 var(--szov);
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--kek); }
:focus-visible { outline: 3px solid var(--kek); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-family: var(--disp); text-wrap: balance; }
svg { display: block; }

.keret {
  max-width: 560px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Időjárás-sáv */
.sav { background: var(--sav-semleges); color: var(--sav-szoveg); transition: background .25s; }
.sav[data-all="jo"] { background: var(--sav-jo); }
.sav[data-all="valtozo"] { background: var(--sav-valtozo); }
.sav[data-all="rossz"] { background: var(--sav-rossz); }
.sav .keret { padding-block: 14px 18px; display: grid; gap: 10px; }
.fejlec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.marka { font: 700 15px/1 var(--disp); letter-spacing: .01em; }
.nap-cim { font-size: 13.5px; opacity: .88; font-variant-numeric: tabular-nums; }
.itelet { font-size: 31px; line-height: 1.08; font-weight: 700; letter-spacing: -.012em; }
.indok { margin: 0; font-size: 15px; opacity: .92; }
.adatok { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
.adatok b { font-weight: 650; }
.kezi { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kezi button {
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 99px;
  padding: 6px 13px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--sav-szoveg);
}
.kezi button[aria-pressed="true"] { background: var(--sav-szoveg); color: #15302a; }
.halk-gomb {
  font-size: 13.5px;
  color: inherit;
  opacity: .85;
  text-decoration: underline;
  text-underline-offset: 2px;
  justify-self: start;
  min-height: 28px;
}

/* Hét napjai */
.napok { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding-block: 10px 2px; }
.napgomb {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 7px 0 6px;
  border-radius: 10px;
  border: 1.5px solid transparent;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--tinta);
  min-width: 0;
}
.napgomb .nn { font-weight: 650; }
.napgomb.hetvege .nn { color: var(--kek); }
.napgomb svg { width: 24px; height: 24px; }
.napgomb .fok { color: var(--halk); }
.napgomb[aria-pressed="true"] { background: var(--lap); border-color: var(--tinta); }

/* Tartalom */
main { display: grid; gap: 26px; padding-top: 16px; }
.szakasz { display: grid; gap: 10px; }
.szakasz-fej { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.szakasz h2 { font-size: 20px; font-weight: 700; line-height: 1.15; }
.masik { font-size: 14px; font-weight: 600; color: var(--kek); white-space: nowrap; min-height: 32px; }
.lista { display: grid; gap: 10px; }

.kartya { background: var(--lap); border: 1px solid var(--vonal); border-radius: 14px; overflow: hidden; }
.kartya.valasztott { border-color: var(--kek); box-shadow: 0 0 0 1px var(--kek); }
.kartya.voltunk .k-nev { color: var(--halk); }
.k-fo {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 11px;
  width: 100%;
  text-align: left;
  padding: 13px 13px 10px;
}
.jel { width: 34px; height: 34px; }
.k-nev { display: block; font-size: 17px; font-weight: 650; line-height: 1.25; }
.k-rov { display: block; font-size: 15px; color: var(--halk); margin-top: 2px; }
.k-meta { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 13px; color: var(--halk); margin-top: 6px; }
.cimke { font-weight: 650; }
.cimke.ing { color: var(--zold); }
.cimke.volt { color: var(--kek); }
.cimke.zart { color: var(--piros); }
.k-gombok { display: flex; align-items: center; gap: 4px; padding: 0 8px 9px 58px; }
.valaszt {
  margin-right: auto;
  padding: 7px 13px;
  border-radius: 9px;
  background: var(--kek-halvany);
  color: var(--kek);
  font-size: 14.5px;
  font-weight: 650;
}
.valaszt[aria-pressed="true"] { background: var(--kek); color: var(--lap); }
.ikon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--halk); }
.ikon svg { width: 22px; height: 22px; }
.ikon[aria-pressed="true"].sziv { color: var(--piros); }
.ikon[aria-pressed="true"].pipa { color: var(--zold); }

.terv {
  background: var(--lap);
  border: 1.5px solid var(--kek);
  border-radius: 14px;
  padding: 12px 13px;
  display: grid;
  gap: 8px;
}
.terv .cim { font-size: 13px; font-weight: 650; color: var(--kek); }
.terv .nev { font: 700 18.5px/1.2 var(--disp); }
.sor { display: flex; flex-wrap: wrap; gap: 8px; }
.gomb {
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 15px;
  font-weight: 650;
  background: var(--lap2);
  color: var(--tinta);
  text-align: center;
  text-decoration: none;
  display: inline-block;
}
.gomb.fo { background: var(--kek); color: var(--lap); }

.ures { color: var(--halk); font-size: 15px; margin: 0; }
.musor { display: grid; gap: 1px; background: var(--vonal); border: 1px solid var(--vonal); border-radius: 14px; overflow: hidden; }
.musor a {
  background: var(--lap);
  padding: 11px 13px;
  text-decoration: none;
  color: var(--tinta);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-weight: 550;
  font-size: 15.5px;
}
.musor a span { color: var(--kek); }

/* Összes */
.kereso {
  width: 100%;
  padding: 11px 13px;
  border-radius: 11px;
  border: 1px solid var(--vonal);
  background: var(--lap);
  font-size: 16px;
}
.szurok { display: flex; gap: 7px; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.szurok::-webkit-scrollbar { display: none; }
.szuro {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px 6px 7px;
  border-radius: 99px;
  border: 1px solid var(--vonal);
  background: var(--lap);
  font-size: 14.5px;
  font-weight: 600;
}
.szuro .jel { width: 20px; height: 20px; }
.szuro.sima { padding-left: 12px; }
.szuro[aria-pressed="true"] { background: var(--tinta); color: var(--bg); border-color: var(--tinta); }
.szegmens { display: grid; grid-template-columns: 1fr 1fr; background: var(--lap2); border-radius: 11px; padding: 3px; }
.szegmens button { padding: 8px; border-radius: 9px; font-weight: 650; font-size: 15px; }
.szegmens button[aria-pressed="true"] { background: var(--lap); }
.oldalcim { font-size: 26px; font-weight: 700; padding-top: 16px; }

.mentes { display: grid; gap: 8px; font-size: 14.5px; color: var(--halk); border-top: 1px solid var(--vonal); padding-top: 14px; }
.mentes h3 { font-size: 16px; color: var(--tinta); }
.mentes p { margin: 0; }
.mentes textarea {
  width: 100%;
  min-height: 70px;
  padding: 9px;
  border-radius: 10px;
  border: 1px solid var(--vonal);
  background: var(--lap);
  font-size: 13px;
  color: var(--tinta);
}

/* Alsó sáv */
.fulek {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 5;
  background: var(--lap);
  border-top: 1px solid var(--vonal);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.fulek > div { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.ful { display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; font-size: 12.5px; font-weight: 600; color: var(--halk); }
.ful svg { width: 24px; height: 24px; }
.ful[aria-current="page"] { color: var(--kek); }

/* Részletek */
dialog.lap {
  border: 0;
  padding: 0;
  margin: auto auto 0;
  width: 100%;
  max-width: 560px;
  max-height: 88dvh;
  background: var(--bg);
  color: var(--tinta);
  border-radius: 18px 18px 0 0;
  overflow: auto;
}
dialog.lap::backdrop { background: rgba(7, 18, 15, .55); }
@media (min-width: 620px) { dialog.lap { margin: auto; border-radius: 18px; } }
.lap-bel {
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid;
  gap: 12px;
}
.lap-fej { display: grid; grid-template-columns: 38px minmax(0, 1fr) 36px; gap: 10px; align-items: start; }
.lap-fej .jel { width: 38px; height: 38px; }
.lap-fej h2 { font-size: 23px; font-weight: 700; line-height: 1.12; }
.lap-fej small { display: block; font-size: 13.5px; color: var(--halk); margin-bottom: 2px; }
.bezar { width: 36px; height: 36px; border-radius: 50%; background: var(--lap2); display: grid; place-items: center; }
.bezar svg { width: 18px; height: 18px; }
.lap-szov { margin: 0; }
.tenyek { margin: 0; display: grid; gap: 8px; }
.tenyek div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 15px; }
.tenyek dt { color: var(--halk); font-size: 14px; }
.tenyek dd { margin: 0; }
.datumok { display: flex; flex-wrap: wrap; gap: 6px; }
.datum { background: var(--lap); border: 1px solid var(--vonal); border-radius: 8px; padding: 3px 8px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tipp { background: var(--kek-halvany); border-radius: 10px; padding: 9px 11px; font-size: 14.5px; margin: 0; }
.figy { color: var(--piros); font-weight: 600; font-size: 14.5px; margin: 0; }
.lap-gombok { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lap-gombok .teljes { grid-column: 1 / -1; }
.lap-gombok .gomb[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: -2px; }
.apro { font-size: 12.5px; color: var(--halk); margin: 0; }

.uzenet {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--tinta);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 600;
  z-index: 20;
  max-width: calc(100% - 32px);
}

@media (prefers-reduced-motion: reduce) { .sav { transition: none; } }

</style>
</head>
<body>
<header id="sav" class="sav"></header>
<div class="keret"><div id="napok" class="napok" role="group" aria-label="Nap kiválasztása"></div><main id="fo"></main></div>
<nav class="fulek" aria-label="Fő menü"><div>
  <button class="ful" data-ful="ajanlat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20 9.5 7l4 7.5 2.5-4L21 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Ajánlat</button>
  <button class="ful" data-ful="osszes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Összes</button>
  <button class="ful" data-ful="sajat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.8-4.7-9.4-9.3C1.5 7.9 3.6 4.8 7 4.8c2 0 3.6 1 5 2.9 1.4-1.9 3-2.9 5-2.9 3.4 0 5.5 3.1 4.4 6.4-1.6 4.6-9.4 9.3-9.4 9.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Kedvencek</button>
</div></nav>
<dialog id="lap" class="lap" aria-label="Program részletei"></dialog>
<div id="uzenet" class="uzenet" role="status" aria-live="polite" hidden></div>
<script>

const ketjegy = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${ketjegy(d.getMonth() + 1)}-${ketjegy(d.getDate())}`;
const dt = s => new Date(s + 'T12:00:00');
const NAPNEV = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];

const nagy = s => s.charAt(0).toUpperCase() + s.slice(1);
const rovDatum = s => { const d = dt(s); return `${HONAP[d.getMonth()].slice(0, 3)}. ${d.getDate()}.`; };
const hosszuDatum = s => { const d = dt(s); return `${HONAP[d.getMonth()]} ${d.getDate()}.`; };
function napNeve(s) {
  const ma = ymd(new Date());

  return NAPNEV[dt(s).getDay()];
}

  else if (kod === 2) b = `<g transform="translate(-3 -3.5) scale(.8)">${nap}</g><g transform="translate(2 3) scale(.85)">${felho()}</g>`;
  else if (kod === 3 || kod === 45 || kod === 48) b = felho(2);
  else if ((kod >= 71 && kod <= 77) || kod === 85 || kod === 86) b = felho(-3) + '<path d="M8 18.5h.01M12 20.5h.01M16 18.5h.01" stroke="#7fb0ff" stroke-width="2.6" stroke-linecap="round"/>';
  else if (kod >= 95) b = felho(-3) + '<path d="m12.5 15-2.5 4h3l-2 3.5" fill="none" stroke="#e0ab00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  else b = felho(-3) + '<path d="m8.5 17.5-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${b}</svg>`;
}

/* ---------- Tárolás ---------- */
const KULCS = 'kiruccano.v1';
function olvas(k, ures) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : ures; } catch { return ures; } }
function ir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
const jelol = Object.assign({ kedvenc: {}, voltunk: {}, terv: {} }, olvas(KULCS, {}));
const ment = () => ir(KULCS, jelol);

/* ---------- Állapot ---------- */
const A = { ful: 'ajanlat', nap: null, napok: [], idoHiba: false, idoTolt: true, kezi: {}, keziNyit: false, eltol: {}, szuro: 'mind', keres: '', listaMod: 'kedvenc', esemenyek: [], frissitve: null, nyitott: null };

function vazNapok() {
  const t = [];
  for (let i = 0; i < 7; i++) t.push({ d: ymd(new Date(Date.now() + i * 864e5)) });
  return t;
}
A.napok = vazNapok();

function alapNap(napok) {
  const most = new Date(), w = most.getDay(), ma = ymd(most);
  if (w === 6 || (w === 0 && most.getHours() < 15)) return ma;
  const szo = napok.find(n => n.d > ma && dt(n.d).getDay() === 6);
  return szo ? szo.d : ma;
}
A.nap = alapNap(A.napok);

/* ---------- Időjárás ---------- */
const IDO_URL = 'https://api.open-meteo.com/v1/forecast?latitude=47.5&longitude=19.04' +
  '&hourly=precipitation,precipitation_probability,weather_code' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_gusts_10m_max,sunset' +
  '&timezone=Europe%2FBudapest&past_days=1&forecast_days=7';
const IDO_KULCS = 'kiruccano.ido';

function feldolgoz(j) {
  const ma = ymd(new Date());
  const orak = {};
  j.hourly.time.forEach((t, i) => {
    const d = t.slice(0, 10), h = +t.slice(11, 13);
    (orak[d] = orak[d] || []).push({ h, mm: j.hourly.precipitation[i] || 0, val: j.hourly.precipitation_probability[i] || 0, kod: j.hourly.weather_code[i] || 0 });
  });
  const napok = j.daily.time.map((d, i) => ({
    d, kod: j.daily.weather_code[i], max: j.daily.temperature_2m_max[i], min: j.daily.temperature_2m_min[i],
    csap: j.daily.precipitation_sum[i], szel: j.daily.wind_gusts_10m_max[i],
    lemegy: (j.daily.sunset[i] || '').slice(11, 16), orak: orak[d] || [],
    elozo: i > 0 ? j.daily.precipitation_sum[i - 1] : 0
  }));
  return napok.filter(n => n.d >= ma);
}

/* A döntés 9 és 18 óra közötti órákból készül, így az éjszakai eső nem számít. */
function nappali(n) {
  const ma = n.d === ymd(new Date());
  const tol = ma ? Math.max(9, new Date().getHours()) : 9;
  const o = n.orak.filter(x => x.h >= tol && x.h < 18);
  const lista = o.length ? o : n.orak.filter(x => x.h >= 9 && x.h < 18);
  return {
    mm: lista.reduce((s, x) => s + x.mm, 0),
    esos: lista.filter(x => x.mm >= 0.2).length,
    val: lista.reduce((m, x) => Math.max(m, x.val), 0),
    vihar: lista.some(x => x.kod >= 95),
    ho: lista.some(x => (x.kod >= 71 && x.kod <= 77) || x.kod === 85 || x.kod === 86)
  };
}

function minosit(n) {
  if (n.orak == null || !n.orak.length) return null;
  const x = nappali(n);
  let all = 'jo', ok = 'szaraz';
  if (x.vihar) { all = 'rossz'; ok = 'vihar'; }
  else if ((n.szel || 0) >= 60) { all = 'rossz'; ok = 'szel'; }
  else if (x.ho && x.mm >= 0.5) { all = 'rossz'; ok = 'ho'; }
  else if (x.mm >= 1 || x.esos >= 2 || x.val >= 65) { all = 'rossz'; ok = 'eso'; }
  else if (x.mm > 0 || x.val >= 35) { all = 'valtozo'; ok = 'kis'; }
  return { all, ok, ...x };
}

function aktualisAllapot() {
  const n = A.napok.find(x => x.d === A.nap) || { d: A.nap };
  if (A.kezi[A.nap]) return { all: A.kezi[A.nap], kezi: true, n };
  const m = minosit(n);
  return m ? { ...m, n } : { all: null, n };
}

const ITELET = {
  szaraz: 'Nem esik, mehettek a szabadba.',
  kis: 'Lehet egy kis eső, legyen B-terv.',
  eso: 'Eső lesz, inkább bent a helyetek.',
  vihar: 'Vihar jöhet, maradjatok fedett helyen.',
  szel: 'Erős szél lesz, az erdő most nem jó ötlet.',
  ho: 'Havazás várható, inkább bent.'
};
const KEZI_ITELET = { jo: 'Jó idő, mehettek a szabadba.', valtozo: 'Változékony idő, legyen B-terv.', rossz: 'Rossz idő, bent a helyetek.' };

async function idoLekeres() {
  const tar = olvas(IDO_KULCS, null);
  const friss = tar && Date.now() - tar.t < 36e5;
  if (tar) { try { alkalmaz(tar.j); } catch { /* régi formátum */ } }
  if (friss) { A.idoTolt = false; rajzol(); return; }
  try {
    const v = await fetch(IDO_URL);
    if (!v.ok) throw new Error('hiba');
    const j = await v.json();
    alkalmaz(j);
    ir(IDO_KULCS, { t: Date.now(), j });
    A.idoHiba = false;
  } catch {
    if (!tar) A.idoHiba = true;
  }
  A.idoTolt = false;
  rajzol();
}
function alkalmaz(j) {
  const napok = feldolgoz(j);
  if (napok.length) {
    A.napok = napok;
    if (!napok.some(n => n.d === A.nap)) A.nap = alapNap(napok);
  }
}

/* ---------- Programok ---------- */
function esemenyIdopontok(e) {
  if (e.idopontok) return e.idopontok;
  return [];
}
function esemenyNapon(e, d) {
  if (e.tol) return d >= e.tol && d <= e.ig;
  return esemenyIdopontok(e).some(t => t.slice(0, 10) === d);
}
function kovetkezo(e, d) {
  if (e.tol) return e.ig >= d ? (e.tol > d ? e.tol : d) : null;
  const k = esemenyIdopontok(e).map(t => t.slice(0, 10)).filter(x => x >= d).sort();
  return k[0] || null;
}
const eid = e => 'e:' + e.id;
const esemenyElem = e => ({ ...e, id: eid(e), nev: e.cim, kat: 'esemeny', hely: e.kint ? 'kint' : 'bent', eredeti: e, ker: e.hely });

function nyitva(p, d) {
  if (p.kat === 'esemeny') return true;
  const x = dt(d), h = x.getMonth() + 1, w = x.getDay(), hn = d.slice(5);
  if (p.honapok && !p.honapok.includes(h)) return false;
  if (p.zarva && p.zarva.includes(w)) return false;
  if (p.zarvaTel && p.zarvaTel.includes(w) && (h >= 9 || h <= 4)) return false;
  if (p.zarvaNapok && p.zarvaNapok.includes(d)) return false;
  if (p.zarvaEvente && p.zarvaEvente.includes(hn)) return false;
  return true;
}

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function utolsoAlkalom(id) { const v = jelol.voltunk[id]; return v && v.datumok.length ? v.datumok[v.datumok.length - 1] : null; }

/* Elöl a kedvencek és a budai helyek, hátul ahol nemrég jártatok. */
function rangsor(lista, d) {
  return lista.map(p => {
    let s = hash(p.id + d);
    if (jelol.kedvenc[p.id]) s += 2;
    if (p.buda) s += .5;
    s += p.elore || 0;
    const u = utolsoAlkalom(p.id);
    if (u) s -= (dt(d) - dt(u)) / 864e5 < 120 ? 4 : 1.5;
    return [s, p];
  }).sort((a, b) => b[0] - a[0]).map(x => x[1]);
}

const helyek = (kats, helyLista, d) => PROGRAMOK.filter(p => kats.includes(p.kat) && helyLista.includes(p.hely) && nyitva(p, d));

function aznapiak(d, csakFedett) {
  return A.esemenyek.filter(e => esemenyNapon(e, d) && !(csakFedett && e.kint)).map(esemenyElem);
}

function szakaszok(all, d) {
  const esem = aznapiak(d, all === 'rossz');
  const bol = { k: 'esem', cim: 'Aznap műsoron', lista: esem, esem: true };
  if (all === 'jo') return [
    { k: 'tura', cim: 'Könnyű kirándulás', lista: helyek(['tura'], ['kint'], d) },
    { k: 'kint', cim: 'Park, játszótér', lista: helyek(['park', 'jatszoter'], ['kint', 'vegyes'], d) },
    bol
  ];
  if (all === 'valtozo') return [
    { k: 'kint', cim: 'Kint, ha kitart az idő', lista: helyek(['tura', 'park', 'jatszoter'], ['kint', 'vegyes'], d) },
    { k: 'bent', cim: 'B-terv fedett helyen', lista: helyek(['jatek', 'muzeum'], ['bent'], d) },
    bol
  ];
  if (all === 'rossz') return [
    { k: 'jatek', cim: 'Trambulin, játszóház', lista: helyek(['jatek'], ['bent'], d) },
    bol,
    { k: 'muzeum', cim: 'Múzeum, kiállítás, barlang', lista: helyek(['muzeum'], ['bent'], d) }
  ];
  return [
    { k: 'kint', cim: 'Ha jó idő lesz', lista: helyek(['tura', 'park', 'jatszoter'], ['kint', 'vegyes'], d) },
    { k: 'bent', cim: 'Ha rossz idő lesz', lista: helyek(['jatek', 'muzeum'], ['bent'], d) },
    bol
  ];
}

function metaSor(p, d) {
  const t = [];

  if (u) t.push(`<span class="cimke volt">Voltatok: ${esc(rovDatum(u))}</span>`);

}

const DARAB = 3;

  }

  const k = s.k + '|' + d;
  const el = sor.length > DARAB ? (A.eltol[k] || 0) % sor.length : 0;

  for (let i = 0; i < Math.min(DARAB, sor.length); i++) mutat.push(sor[(el + i) % sor.length]);

    <div class="szakasz-fej"><h2>${esc(s.cim)}</h2>

function sajatRajz() {
  const mod = A.listaMod;
  const lista = mod === 'kedvenc'
    ? Object.keys(jelol.kedvenc).map(keresId).filter(Boolean)
    : Object.keys(jelol.voltunk).sort((a, b) => (utolsoAlkalom(b) || '').localeCompare(utolsoAlkalom(a) || '')).map(keresId).filter(Boolean);
  const ures = mod === 'kedvenc'
    ? 'Még nincs kedvenc. A szív ikonnal jelölhetsz egy programot, és ezek kerülnek az ajánlatok elejére.'
    : 'Még nincs itt semmi. A pipa ikonnal jelöld, ahol már voltatok, és az ajánlat a lista végére teszi.';
  $('#fo').innerHTML = `
    <section class="szakasz">
      <div class="szegmens" role="group">
        <button data-lista="kedvenc" aria-pressed="${mod === 'kedvenc'}">Kedvencek (${Object.keys(jelol.kedvenc).length})</button>
        <button data-lista="voltunk" aria-pressed="${mod === 'voltunk'}">Voltunk (${Object.keys(jelol.voltunk).length})</button>
      </div>
      <div class="lista">${lista.map(p => kartya(p, null, false)).join('') || `<p class="ures">${ures}</p>`}</div>
    </section>
    <section class="mentes">
      <h3>Mentőkód</h3>
      <p>A jelölések ezen a telefonon vannak. Másik készülékre a mentőkóddal viheted át.</p>
      <textarea id="mentokod" aria-label="Mentőkód" placeholder="Illeszd ide a mentőkódot"></textarea>
      <div class="sor"><button class="gomb" data-kod="masol">Kód másolása</button><button class="gomb" data-kod="tolt">Kód betöltése</button></div>
    </section>`;
}

function fulekRajz() {
  document.querySelectorAll('.ful').forEach(f => {
    if (f.dataset.ful === A.ful) f.setAttribute('aria-current', 'page'); else f.removeAttribute('aria-current');
  });
}

function rajzol() {
  savRajz();
  $('#sav').hidden = A.ful !== 'ajanlat';
  napokRajz();
  ({ ajanlat: ajanlatRajz, osszes: osszesRajz, sajat: sajatRajz }[A.ful])();
  fulekRajz();
  if (A.nyitott) lapRajz(A.nyitott);
}

/* ---------- Részletek lap ---------- */
function tenyek(p) {
  const s = [];
  const add = (c, v) => { if (v) s.push(`<div><dt>${esc(c)}</dt><dd>${esc(v)}</dd></div>`); };
  add(p.kat === 'esemeny' ? 'Helyszín' : 'Kerület', p.kat === 'esemeny' ? p.hely : p.ker);
  add('Cím', p.cim || (p.kat === 'esemeny' ? p.terkep : ''));
  add('Táv', p.hossz);
  add('Nyitva', p.ido);
  add('Ár', p.ar);
  add('Ajánlott', p.kor);
  add('Odajutás', p.jut);
  return s.join('');
}

function esemenyDatumok(p) {
  const ma = ymd(new Date());
  if (p.tol) return `<p class="lap-szov"><b>${esc(hosszuDatum(p.tol))} – ${esc(hosszuDatum(p.ig))}</b>${p.megj ? '<br>' + esc(p.megj) : ''}</p>`;
  const jovo = (p.idopontok || []).filter(t => t.slice(0, 10) >= ma);
  if (!jovo.length) return '<p class="ures">Az ismert időpontok elmúltak.</p>';
  return `<div class="datumok">${jovo.slice(0, 10).map(t => `<span class="datum">${esc(rovDatum(t.slice(0, 10)))}${t.length > 10 ? ' ' + esc(t.slice(11)) : ''}</span>`).join('')}</div>`;
}

function lapRajz(id) {
  const p = keresId(id);
  if (!p) return;
  const kedv = !!jelol.kedvenc[id], volt = jelol.voltunk[id];
  const terv = jelol.terv[A.nap];
  const ez = terv && terv.id === id;
  const q = encodeURIComponent(p.cim && p.kat !== 'esemeny' ? p.cim : (p.terkep || p.nev));
  const zart = A.ful === 'ajanlat' && !nyitva(p, A.nap);
  $('#lap').innerHTML = `<div class="lap-bel">
    <div class="lap-fej">${jelSvg(p.kat, p.jel)}<div><small>${esc(p.kat === 'esemeny' ? (TIPUS[p.tipus] || 'Program') : KAT[p.kat].nev)}</small><h2>${esc(p.nev)}</h2></div>
      <button class="bezar" data-bezar="1" aria-label="Bezárás">${IKON.x}</button></div>
    ${zart ? '<p class="figy">Ezen a napon zárva.</p>' : ''}
    <p class="lap-szov">${esc(p.leiras || p.rovid)}</p>
    ${p.kat === 'esemeny' ? esemenyDatumok(p) : ''}
    <dl class="tenyek">${tenyek(p)}</dl>
    ${p.tip ? `<p class="tipp">${esc(p.tip)}</p>` : ''}
    ${volt ? `<p class="apro">Voltatok itt: ${volt.datumok.map(rovDatum).join(', ')}.</p>` : ''}
    <div class="lap-gombok">
      ${A.ful === 'ajanlat' ? `<button class="gomb fo teljes" data-valaszt="${esc(id)}">${ez ? 'Mégsem ezt választjuk' : 'Ezt választjuk'}</button>` : ''}
      <button class="gomb" data-kedv="${esc(id)}" aria-pressed="${kedv}">${kedv ? 'Kedvenc' : 'Kedvencekhez'}</button>
      <button class="gomb" data-volt="${esc(id)}" aria-pressed="${!!volt}">${volt ? 'Voltunk' : 'Voltunk itt'}</button>
      <a class="gomb" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Térkép</a>
      ${p.link ? `<a class="gomb" href="${esc(p.link)}" target="_blank" rel="noopener">${p.kat === 'esemeny' ? 'Jegy, részletek' : 'Honlap'}</a>` : ''}
    </div>
    <p class="apro">Az árak és a nyitvatartás változhatnak, indulás előtt nézd meg a honlapot.</p>
  </div>`;
}

function lapNyit(id) {
  A.nyitott = id;
  lapRajz(id);
  const d = $('#lap');
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}
function lapZar() { A.nyitott = null; const d = $('#lap'); if (d.open) d.close(); }

/* ---------- Műveletek ---------- */
let uzenetIdo;
function uzen(t) {
  const u = $('#uzenet');
  u.textContent = t; u.hidden = false;
  clearTimeout(uzenetIdo);
  uzenetIdo = setTimeout(() => { u.hidden = true; }, 2200);
}
const pillanat = p => ({ id: p.id, nev: p.nev, kat: p.kat, jel: p.jel, rovid: p.rovid, ker: p.ker, leiras: p.leiras, link: p.link, hely: p.hely });

function kedvencValt(id) {
  if (jelol.kedvenc[id]) { delete jelol.kedvenc[id]; uzen('Kikerült a kedvencek közül'); }
  else { jelol.kedvenc[id] = pillanat(keresId(id)); uzen('Kedvenc lett'); }
  ment();
}
function voltValt(id, datum) {
  if (jelol.voltunk[id] && !datum) { delete jelol.voltunk[id]; uzen('Jelölés törölve'); }
  else {
    const p = keresId(id);
    const v = jelol.voltunk[id] || { ...pillanat(p), datumok: [] };
    const nap = datum || ymd(new Date());
    if (!v.datumok.includes(nap)) v.datumok.push(nap);
    v.datumok.sort();
    jelol.voltunk[id] = v;
    uzen('Megjelölve: itt voltatok');
  }
  ment();
}
function valaszt(id) {
  const t = jelol.terv[A.nap];
  if (t && t.id === id) { delete jelol.terv[A.nap]; uzen('Választás törölve'); }
  else { jelol.terv[A.nap] = { id, nev: keresId(id).nev }; uzen('Ezt választottátok'); }
  ment();
}

const kodol = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dekodol = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));

async function kodMuvelet(m) {
  const t = $('#mentokod');
  if (m === 'masol') {
    t.value = kodol(jelol);
    try { await navigator.clipboard.writeText(t.value); uzen('Vágólapra másolva'); }
    catch { t.select(); uzen('Jelöld ki és másold ki a kódot'); }
    return;
  }
  try {
    const u = dekodol(t.value);
    Object.assign(jelol.kedvenc, u.kedvenc || {});
    for (const [id, v] of Object.entries(u.voltunk || {})) {
      const r = jelol.voltunk[id];
      jelol.voltunk[id] = r ? { ...v, datumok: [...new Set([...r.datumok, ...v.datumok])].sort() } : v;
    }
    Object.assign(jelol.terv, u.terv || {});
    ment(); rajzol(); uzen('Mentőkód betöltve');
  } catch { uzen('Ez a kód nem jó, másold ki újra'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-nyit]');
  if (!b) { if (e.target.id === 'lap') lapZar(); return; }
  const d = b.dataset;
  if (d.ful) { A.ful = d.ful; rajzol(); window.scrollTo(0, 0); }
  else if (d.nap) { A.nap = d.nap; A.keziNyit = false; rajzol(); }
  else if (d.kezi) { A.kezi[A.nap] = A.kezi[A.nap] === d.kezi ? undefined : d.kezi; rajzol(); }
  else if (d.kezinyit) { A.keziNyit = true; rajzol(); }
  else if (d.kezitorol) { delete A.kezi[A.nap]; A.keziNyit = false; rajzol(); }
  else if (d.ujra) { A.idoTolt = true; rajzol(); idoLekeres(); }
  else if (d.masik) { A.eltol[d.masik] = (A.eltol[d.masik] || 0) + DARAB; rajzol(); }
  else if (d.nyit) lapNyit(d.nyit);
  else if (d.bezar) lapZar();
  else if (d.kedv) { kedvencValt(d.kedv); rajzol(); }
  else if (d.volt) { voltValt(d.volt); rajzol(); }
  else if (d.valaszt) { valaszt(d.valaszt); rajzol(); }
  else if (d.szuro) { A.szuro = d.szuro; rajzol(); }
  else if (d.lista) { A.listaMod = d.lista; rajzol(); }
  else if (d.kod) kodMuvelet(d.kod);
  else if (d.regiigen) { const t = jelol.terv[d.regiigen]; voltValt(t.id, d.regiigen); delete jelol.terv[d.regiigen]; ment(); rajzol(); }
  else if (d.reginem) { delete jelol.terv[d.reginem]; ment(); rajzol(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'kereso') {
    A.keres = e.target.value;
    const pos = e.target.selectionStart;
    osszesRajz();
    const k = $('#kereso'); k.focus(); k.setSelectionRange(pos, pos);
  }
});
$('#lap').addEventListener('close', () => { A.nyitott = null; });

/* ---------- Indulás ---------- */
async function esemenyTolt() {
  try {
    const v = await fetch('programok.json', { cache: 'no-cache' });
    if (!v.ok) throw new Error('hiba');
    const j = await v.json();
    A.esemenyek = j.esemenyek || [];
    A.frissitve = j.frissitve || null;
    rajzol();
  } catch { /* a helyszínek enélkül is működnek */ }
}

rajzol();
esemenyTolt();
idoLekeres();

</script>
</body>
</html>
